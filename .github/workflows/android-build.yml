name: Android Build

# Builds MIHAD AUDIO's release APK on GitHub-hosted runners. The user's own
# videos/audio are never involved here - this workflow only compiles the
# app itself. All real video/audio processing happens later, locally, on
# the Android device that installs the resulting APK.

on:
  workflow_dispatch: {}
  push:
    branches: [main, arena/01a107d9-mihad-audio]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter environment info
        run: flutter doctor -v

      - name: Clean previous outputs
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: |
          set +e
          flutter analyze 2>&1 | tee analyze.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            msg=$(tail -n 80 analyze.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=flutter analyze failed::$msg"
          fi
          exit "$status"

      - name: Run tests
        run: |
          set +e
          flutter test 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            msg=$(tail -n 120 test.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=flutter test failed::$msg"
          fi
          exit "$status"

      - name: Build release APK
        run: flutter build apk --release

      - name: Store release APK in branch or GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          size=$(stat -c%s "$apk")
          echo "::notice title=Release APK built::${apk} (${size} bytes)"
          if [ "$size" -lt 95000000 ]; then
            mkdir -p release
            cp "$apk" release/mihad_audio_release.apk
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f release/mihad_audio_release.apk
            git commit -m "add release apk artifact [skip ci]"
            git push origin HEAD:arena/01a107d9-mihad-audio
          else
            tag="arena-apk-${GITHUB_RUN_ID}"
            gh release create "$tag" "$apk#app-release.apk" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "MIHAD AUDIO release APK ${GITHUB_RUN_ID}" \
              --notes "Release APK built from ${GITHUB_SHA}" \
              --prerelease
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mihad-audio-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
