name: mihad_audio
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  ffmpeg_kit_flutter_new: ^4.6.4
  fftea: ^1.5.0+1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  gal: ^2.3.3
  just_audio: ^0.10.6
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  uuid: ^4.6.0
  video_player: ^2.14.1
  video_thumbnail: ^0.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.3
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

# MIHAD AUDIO's own original, Flutter/AI-generated brand icon (no
# third-party or copyrighted logos are used anywhere in this app).
flutter_launcher_icons:
  android: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 24
